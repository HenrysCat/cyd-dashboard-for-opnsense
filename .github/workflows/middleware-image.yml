name: Build middleware image

# Publishes middleware/ as a container image to GitHub's own registry (GHCR),
# so Portainer can pull a prebuilt image instead of compiling on your NAS.
on:
  push:
    branches: [main, master]
    paths:
      - 'middleware/**'
      - '.github/workflows/middleware-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated, for Raspberry Pi and ARM NAS hosts.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided automatically by Actions; no secret to create.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases this, so a mixed-case owner is fine.
          images: ghcr.io/${{ github.repository_owner }}/cyd-dashboard-middleware
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: middleware
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
