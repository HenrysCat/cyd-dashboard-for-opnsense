[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA updates need TWO app partitions to flash between, so a single-app table
; (huge_app.csv) will not work -- Update.begin() fails with no partition to
; write to. min_spiffs gives ~1.875MB per slot, which the current ~1.36MB
; build fits with room to spare. The default table's 1.25MB slots are too
; small for this firmware.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.11
    bblanchon/ArduinoJson @ ^7.2.0
    tzapu/WiFiManager @ ^2.0.17

build_flags =
    -I include
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1

    ; ---- TFT_eSPI panel config ----
    ; Passed as -D flags rather than via `-include include/User_Setup.h`: a
    ; forced-include header does NOT reliably reach TFT_eSPI's own translation
    ; units, so settings written there were silently ignored by the library
    ; (while still looking correct from our code) -- which caused ~80px of the
    ; panel to never be addressed, showing as a permanent noise strip. -D flags
    ; apply to every translation unit, including the library's.
    ;
    ; This exact combination is verified working on the real board.
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; Declared so TFT_eSPI keeps the touch chip deselected during its own
    ; transfers. Actual touch I/O is done with raw SPI reads on a separate
    ; bus -- see display_driver.cpp.
    -DTOUCH_CS=33
    -DTFT_INVERSION_ON=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
